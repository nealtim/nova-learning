
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Learning</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111214;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  height: 65px;
  background: #191a1e;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 30px;
  border-bottom: 1px solid #292a30;
}
.logo { font-size: 23px; font-weight: bold; }
nav { display: flex; gap: 22px; color: #bbb; }
nav a { color: inherit; text-decoration: none; }
nav a:hover { color: white; }
.search {
  margin-left: auto;
  background: #292a30;
  border: 1px solid #393a42;
  border-radius: 8px;
  padding: 11px 14px;
  color: white;
  width: 230px;
}
main { padding: 30px; max-width: 1400px; margin: auto; }
h1 { font-size: 30px; margin-bottom: 8px; }
.subtitle { color: #999; margin-bottom: 30px; }
h2 { font-size: 21px; margin-top: 35px; }
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 20px;
}
.game {
  background: #1d1e23;
  border: 1px solid #303138;
  border-radius: 12px;
  overflow: hidden;
  transition: transform .2s, border-color .2s;
  color: white;
  text-decoration: none;
}
.game:hover { transform: translateY(-5px); border-color: #777; }
.thumbnail {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 48px;
  background: linear-gradient(135deg, #292d40, #51417c);
}
.game h3 { margin: 13px 13px 5px; }
.game p { margin: 0 13px 15px; color: #999; font-size: 13px; }
@media(max-width:600px) {
  header { padding: 0 14px; gap: 14px; }
  nav { display: none; }
  .search { width: 130px; }
  main { padding: 20px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ NOVA</div>
  <nav>
    <a href="#">Home</a>
    <a href="#discover">Discover</a>
    <a href="#library">Library</a>
  </nav>
  <input class="search" id="search" placeholder="Search games...">
</header>

<main>
  <h1>Discover</h1>
  <p class="subtitle">Find your next favorite game.</p>

  <h2 id="discover">Featured Games</h2>
  <div class="games" id="games">
    <a class="game" href="arena.html">
      <div class="thumbnail">🎯</div>
      <h3>Nova FPS</h3>
      <p>Multiplayer · Action</p>
    </a>
    <a class="game" href="#">
      <div class="thumbnail">🏎️</div>
      <h3>Speed Rush</h3>
      <p>Racing · Coming soon</p>
    </a>
    <a class="game" href="#">
      <div class="thumbnail">🧱</div>
      <h3>Block World</h3>
      <p>Sandbox · Coming soon</p>
    </a>
    <a class="game" href="#">
      <div class="thumbnail">🌌</div>
      <h3>Galaxy Quest</h3>
      <p>Adventure · Coming soon</p>
    </a>
  </div>
  <h2 id="library">Your Library</h2>
  <p class="subtitle">Your games will appear here.</p>
</main>

<script>
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const query = search.value.toLowerCase();
  document.querySelectorAll(".game").forEach(game => {
    game.style.display = game.innerText.toLowerCase().includes(query) ? "" : "none";
  });
});
</script>
</body>
</html>
